name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include guest links, credentials, or personal data.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem and its impact.
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to Reproduce
      description: Use synthetic data and list the smallest repeatable sequence.
      placeholder: |
        1. Start the local application.
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened? Include redacted error text when useful.
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: The output of `git rev-parse HEAD`.
      placeholder: 40-character commit SHA
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chromium or Chrome
        - Safari or WebKit
        - Firefox
        - Not browser-specific
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add redacted logs, screenshots, or other useful context.
