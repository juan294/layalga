name: Production probes
run-name: "Production probes: ${{ inputs.commit }} writes and removes two probe fixture households"

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character SHA currently deployed to production
        required: true
        type: string
      acknowledge:
        description: This creates two probe fixture households and deletes them after the run
        required: true
        type: choice
        options:
          - WRITE PROBE FIXTURE

permissions:
  contents: read

concurrency:
  group: production-probes
  cancel-in-progress: false

jobs:
  probes:
    name: Production release probes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-probes
    steps:
      - name: Validate the production candidate
        env:
          ACKNOWLEDGEMENT: ${{ inputs.acknowledge }}
          CANDIDATE_SHA: ${{ inputs.commit }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          PRODUCTION_URL: https://layalga.thecreativetoken.com
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ACKNOWLEDGEMENT" != "WRITE PROBE FIXTURE" ]]; then
            echo "The acknowledgement must equal WRITE PROBE FIXTURE." >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The candidate must be a full lowercase 40-character commit SHA." >&2
            exit 1
          fi
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Production probes must be dispatched from main." >&2
            exit 1
          fi
          if [[ "$CANDIDATE_SHA" != "$DISPATCH_SHA" ]]; then
            echo "The candidate does not match the dispatched main commit." >&2
            exit 1
          fi

          health_file="$RUNNER_TEMP/layalga-production-health.json"
          curl --fail --silent --show-error \
            "$PRODUCTION_URL/api/health" > "$health_file"
          jq -e '.status == "ok"' "$health_file" > /dev/null
          deployed_sha=$(jq -er \
            '.commit | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            "$health_file")
          if [[ "$CANDIDATE_SHA" != "$deployed_sha" ]]; then
            echo "The candidate does not match the commit reported by production." >&2
            exit 1
          fi

      - name: Record the blast radius
        shell: bash
        run: |
          {
            echo "## Production probe blast radius"
            echo
            echo "This run creates two fixture households named \`Release probe <run id>\` and \`Release probe conflict <run id>\`, then deletes them."
            echo "It never reads or writes a real household: every probe row lives under the fixture homes, and cleanup deletes by exact id and name."
            echo "If a run stops before cleanup, its log prints \`pnpm run release:probes -- --cleanup-only <run id>\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the production probes
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          LINK_TOKEN_SECRET: ${{ secrets.PROD_LINK_TOKEN_SECRET }}
          AGENT_ROUTE_SECRET: ${{ secrets.PROD_AGENT_ROUTE_SECRET }}
          TICK_SECRET: ${{ secrets.PROD_TICK_SECRET }}
          APP_URL: https://layalga.thecreativetoken.com
          EXPECTED_COMMIT_SHA: ${{ inputs.commit }}
          MEMORY: agentcore
          PRODUCTION_URL: https://layalga.thecreativetoken.com
        shell: bash
        run: |
          set -euo pipefail
          health_file="$RUNNER_TEMP/layalga-pre-probe-health.json"
          curl --fail --silent --show-error \
            "$PRODUCTION_URL/api/health" > "$health_file"
          jq -e '.status == "ok"' "$health_file" > /dev/null
          deployed_sha=$(jq -er \
            '.commit | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            "$health_file")
          if [[ "$EXPECTED_COMMIT_SHA" != "$deployed_sha" ]]; then
            echo "Production changed after candidate admission; refusing to run." >&2
            exit 1
          fi
          pnpm run release:probes -- \
            --target production \
            --base https://layalga.thecreativetoken.com \
            --expect-runtime agentcore
