allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  # better-sqlite3, node-llama-cpp, and the tree-sitter-* parsers arrived
  # transitively through @tobilu/qmd, an optional local embeddings/search
  # dependency of @strands-agents/sdk@1.16.0 (Phase 4's tracing upgrade).
  # Nothing in this repository imports qmd or its local memory feature, so
  # their native build scripts are denied rather than reviewed and run.
  better-sqlite3: false
  esbuild: true
  node-llama-cpp: false
  # protobufjs arrived transitively through @grpc/grpc-js, needed by the
  # OTLP gRPC exporters @aws/aws-distro-opentelemetry-node-autoinstrumentation
  # bundles (Phase 4's tracing upgrade). Its postinstall only prints a
  # version-scheme warning (scripts/postinstall.js) and is not required for
  # protobufjs to function, so it is denied.
  protobufjs: false
  tree-sitter-go: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter-typescript: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@aws-sdk/client-bedrock-agentcore-control@3.1121.0"
  - "@aws-sdk/client-bedrock-agentcore@3.1121.0"
  - "@aws-sdk/client-bedrock-runtime@3.1121.0"
  - "@aws-sdk/client-scheduler@3.1121.0"
  - "@aws-sdk/token-providers@3.1121.0"
  - zod@4.5.2
  - "@aws-sdk/client-s3@3.1121.0"
overrides:
  qs: 6.16.0
  "@opentelemetry/propagator-jaeger": 2.11.0
  # Patched releases for transitive production advisories (pnpm audit --prod,
  # 2026-10-16). proxy-addr, fast-uri and @grpc/grpc-js sit on runtime paths
  # (express and fastify under @strands-agents/sdk and bedrock-agentcore, the
  # ADOT gRPC exporters); each override stays inside its major version.
  "@grpc/grpc-js": 1.14.6
  "brace-expansion@1": 1.1.21
  "brace-expansion@2": 2.1.7
  "brace-expansion@5": 5.0.12
  "fast-uri@3": 3.1.9
  "fast-uri@4": 4.2.3
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
  # GHSA-qqmp-wf37-98f9: the ADOT distro pins auto-instrumentations-node@0.77.0,
  # whose database instrumentations expose the db.user span attribute. Dependabot
  # security jobs cannot resolve a fix through the parent, so each package is
  # raised to its first patched release (pnpm audit, 2026-10-17). The AgentCore
  # bundle installs from its own derived package, so scripts/build-agent-bundle.sh
  # repeats these eight entries; keep the two lists in step.
  "@opentelemetry/instrumentation-cassandra-driver": 0.66.0
  "@opentelemetry/instrumentation-knex": 0.65.0
  "@opentelemetry/instrumentation-mongoose": 0.67.0
  "@opentelemetry/instrumentation-mysql": 0.67.0
  "@opentelemetry/instrumentation-mysql2": 0.67.0
  "@opentelemetry/instrumentation-oracledb": 0.46.0
  "@opentelemetry/instrumentation-pg": 0.73.0
  "@opentelemetry/instrumentation-tedious": 0.40.0
  # simple-git arrives only through node-llama-cpp under @tobilu/qmd, which
  # nothing here imports (see allowBuilds); the fix exists only in 4.x.
  "@simple-git/argv-parser": 2.0.1
  simple-git: 4.0.2
  # Compatible patches for the 2026-10-26 audit, including optional SDK tools.
  "vite@8": 8.2.4
  "@modelcontextprotocol/server@2": 2.3.0
  "zod@4": 4.6.7
  "body-parser@2": 2.4.0
